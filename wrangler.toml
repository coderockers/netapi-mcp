# Cloudflare Worker "netapi-mcp": the NetAPI MCP server at https://mcp.netapi.com/mcp
name = "netapi-mcp"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "mcp.netapi.com", custom_domain = true }
]

[observability]
enabled = true

# Secret (not in this file): NETAPI_MCP_SECRET - set in the dashboard (Settings > Variables and secrets, type Secret)
# or with `npx wrangler secret put NETAPI_MCP_SECRET`; the same value goes into cfg.php system.mcp_secret on the site.

[vars]
# JSON API the tools call; every tool call is one GET here
NETAPI_JSON_API = "https://netapi.com/api-json/"
NETAPI_SITE = "https://netapi.com"
# ChatGPT app-directory domain proof, served at /.well-known/openai-apps-challenge (public by design)
OPENAI_APPS_CHALLENGE = "-uXEkV73AFvdjn2c9YnuLiXSQcqE2I7vetWvhPETyik"
